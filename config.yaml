scanner:
  timeout: 5
  max_threads: 10

target:
  default_ports:
    - 21
    - 22
    - 23
    - 80
    - 443
    - 8080
    - 8443

modules:
  i1_weak_passwords:
    enabled: true
    wordlist: wordlists/passwords.txt
  i2_insecure_network_services:
    enabled: true
  i3_insecure_ecosystem_interfaces:
    enabled: true
  i5_outdated_components:
    enabled: true
  i7_insecure_data_transfer_storage:
    enabled: true
  i9_insecure_default_settings:
    enabled: true

reporting:
  output_dir: reports/output
  formats:
    - json
    - html
